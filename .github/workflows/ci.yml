name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/uam_test
      INTEGRATION_TESTS: "true"
      EMBEDDED_PG_TESTS: "true"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test

  desktop:
    runs-on: ubuntu-latest
    env:
      # Typechecking doesn't need the Electron binary itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck

  windows-installer:
    runs-on: windows-latest
    env:
      # 1.0 ships unsigned; don't let electron-builder go looking for a cert.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json

      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop

      - name: Install, launch, and uninstall the built installer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem desktop/release/Unified-Achievement-Manager-Setup-*.exe).FullName
          ./desktop/scripts/smoke-test.ps1 -Installer $installer

      - uses: actions/upload-artifact@v7
        with:
          name: Unified-Achievement-Manager-Setup
          # latest.yml and the .blockmap are what auto-update reads (see #314);
          # they're attached to the GitHub Release alongside the installer.
          path: |
            desktop/release/Unified-Achievement-Manager-Setup-*.exe
            desktop/release/Unified-Achievement-Manager-Setup-*.exe.blockmap
            desktop/release/latest.yml
          retention-days: 14

  macos-installer:
    name: macos-installer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json
      - name: Check native build architecture
        run: node -e 'if (process.arch !== "${{ matrix.arch }}") process.exit(1)'
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run dist:mac
        working-directory: desktop
      - name: Install DMG, launch twice, quit, and remove app
        working-directory: desktop
        run: node scripts/smoke-test-macos.mjs release/Unified-Achievement-Manager-*-mac-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Unified-Achievement-Manager-mac-${{ matrix.arch }}
          path: |
            desktop/release/*-mac-${{ matrix.arch }}.dmg
            desktop/release/*-mac-${{ matrix.arch }}.zip
            desktop/release/smoke-macos/
          retention-days: 14
